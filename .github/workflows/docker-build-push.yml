name: Build and Push Docker Images

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3
    
    - name: 🔐 Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: emashachathuni
        password: ${{ secrets.DOCKER_TOKEN }}
    
    - name: 🐳 Build and Push Backend Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: emashachathuni/island-table-backend:latest
    
    - name: 🐳 Build and Push Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: emashachathuni/island-table-frontend:latest
    
    - name: ✅ Success
      run: |
        echo "✅ Images pushed successfully!"
        echo "Backend: https://hub.docker.com/r/emashachathuni/island-table-backend"
        echo "Frontend: https://hub.docker.com/r/emashachathuni/island-table-frontend"
